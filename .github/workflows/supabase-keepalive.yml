# A free Supabase project pauses when idle, which would break the enquiry form. Delete this file on a paid plan.
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    # skipped, not failed, until the repository variables SUPABASE_URL and SUPABASE_ANON_KEY are set
    if: vars.SUPABASE_URL != ''
    runs-on: ubuntu-latest
    steps:
      - name: Call ping()
        env:
          URL: ${{ vars.SUPABASE_URL }}
          KEY: ${{ vars.SUPABASE_ANON_KEY }}
        # a block, so the "apikey: ..." headers are not read as YAML keys
        run: |
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
